[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-count"
dynamic = ["version"]
description = "OVOS count to N skill"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "skill", "plugin"]
dependencies = [
    "ovos-utils>=0.0.38",
    "ovos-workshop>=9.8.1a1,<10.0.0",
    "ovos-number-parser"
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "pytest-timeout>=2.0.0",
    "ovoscope>=1.12.1a1,<2.0.0",
    "ovos-m2v-pipeline>=0.37.3a1",
    "ovos-bus-client",
    "ovos-core[plugins]>=2.0.0a1"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-count"

[project.entry-points."opm.skill"]
"ovos-skill-count.openvoiceos" = "ovos_skill_count:CountSkill"

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_count.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_skill_count*"]

[tool.setuptools.package-data]
ovos_skill_count = [
    "*.json",
    "locale/**/*",
]

[tool.pytest.ini_options]
ovoscope_min_routing_rate = 0.85
