name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@fix/coverage-extras-silent-miss
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_skill_count'
      test_path: 'test/unittests/'
      install_extras: ''
      min_coverage: 0
